<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marcadores imprimibles – Castillo de Chancay AR</title>
<link rel="stylesheet" href="css/estilos.css">
<style>
body{background:#ddd5c4}
.barra-herr{max-width:820px;margin:0 auto;padding:16px;font-size:.9rem}
.barra-herr input{width:100%;padding:10px;border-radius:10px;border:1px solid #b89a6a;margin:6px 0;font-size:.9rem}
.hoja{width:210mm;min-height:297mm;margin:0 auto 18px;background:#fff;padding:16mm 16mm 12mm;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;text-align:center}
.hoja .enc{width:100%;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--oro);padding-bottom:6mm}
.hoja .enc .n{width:22mm;height:22mm;border-radius:50%;background:var(--oceano);color:#fff;display:grid;place-items:center;font-size:12mm;font-weight:800}
.hoja .enc h1{font-size:9mm;color:var(--oceano);text-align:left;flex:1;margin-left:6mm;line-height:1.1}
.hoja .enc h1 small{display:block;font-size:4.2mm;color:var(--teja);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:1.5mm}
.hoja .marcador{width:120mm;height:120mm;margin:9mm 0 5mm}
.hoja .fila{display:flex;gap:10mm;align-items:center;justify-content:center;width:100%;margin-top:2mm}
.hoja .qr{width:48mm;height:48mm}.hoja .qr img,.hoja .qr canvas{width:100%;height:100%;image-rendering:pixelated}
.hoja .inst{text-align:left;font-size:4mm;line-height:1.5;max-width:95mm}
.hoja .inst b{color:var(--oceano)}
.hoja .url{font-size:3mm;color:#7a7a7a;word-break:break-all;margin-top:2mm}
.hoja .pie{position:absolute;bottom:9mm;left:0;right:0;font-size:3mm;letter-spacing:.2em;color:#999}
@media screen and (max-width:820px){.hoja{transform-origin:top left;}}
@media print{body{background:#fff}.barra-herr{display:none}.hoja{box-shadow:none;margin:0;page-break-after:always}@page{size:A4;margin:0}}
</style>
</head><body>
<div class="barra-herr">
  <h2 class="serif" style="color:var(--oceano)">Marcadores imprimibles del recorrido</h2>
  <p>Una hoja A4 por punto: marcador AR (centro) + código QR que abre la estación. Imprime a tamaño real, en papel mate, sin escalar.</p>
  <label>Dirección pública del recorrido (los QR apuntan aquí):
    <input id="base" placeholder="https://trooper8032.github.io/castillo-chancay-ar/"></label>
  <button class="btn btn-pri" onclick="print()" style="max-width:260px">🖨️ Imprimir / Guardar PDF</button>
</div>
<div id="hojas"></div>
<script src="js/datos.js"></script>
<script src="assets/qrcode.min.js"></script>
<script>
const inp = document.getElementById('base');
const q = new URLSearchParams(location.search);
const BASE_PUBLICA = 'https://trooper8032.github.io/castillo-chancay-ar/';
inp.value = q.get('base') || BASE_PUBLICA;
function render(){
  let base = inp.value.trim(); if (!base.endsWith('/')) base += '/';
  document.getElementById('hojas').innerHTML = ESTACIONES.map(e => {
    const url = `${base}estacion.html?p=${e.id}`;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    return `<section class="hoja">
      <div class="enc"><div class="n">${e.id}</div><h1 class="serif">${e.icono} ${e.nombre}<small>Castillo de Chancay · Recorrido en Realidad Aumentada</small></h1></div>
      <img class="marcador" src="marcadores/marcador-${e.id}.png" alt="Marcador ${e.id}">
      <div class="fila">
        <div class="qr">${qr.createImgTag(6, 0)}</div>
        <div class="inst"><b>1.</b> Escanea el <b>código QR</b> con la cámara de tu celular.<br>
          <b>2.</b> Permite el acceso a la cámara.<br>
          <b>3.</b> Apunta al <b>marcador grande</b> y mira aparecer la historia.<br>
          <b>4.</b> Resuelve el acertijo para encontrar el siguiente punto.
          <div class="url">${url}</div></div>
      </div>
      <div class="pie">DESARROLLADO POR RIVERGREEN SOLUTIONS</div>
    </section>`;
  }).join('') + `<section class="hoja">
      <div class="enc"><div class="n">★</div><h1 class="serif">Marcador universal Hiro<small>Para pruebas rápidas · funciona en cualquier punto</small></h1></div>
      <img class="marcador" src="marcadores/hiro.png" alt="Marcador Hiro">
      <p class="inst" style="text-align:center;max-width:150mm">Marcador estándar de AR.js. Cualquier estación lo reconoce además de su propio marcador: útil para demostraciones en oficina.</p>
      <div class="pie">DESARROLLADO POR RIVERGREEN SOLUTIONS</div></section>`;
}
inp.oninput = render; render();
</script>
</body></html>
